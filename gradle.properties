#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6144M -XX:+UseParallelGC
kotlin.mpp.enableCInteropCommonization=true
# Only consume the dedicated *.kotlin_resources.zip variants as KMP resources.
# Gobley's UniFFI configuration is a plain TOML artifact, not a resource archive.
kotlin.mpp.filterResourcesByExtension=true

#Gradle
org.gradle.jvmargs=-Xmx8192M -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Atomicfu IR transformations
kotlinx.atomicfu.enableJvmIrTransformation=true
kotlinx.atomicfu.enableNativeIrTransformation=true
kotlinx.atomicfu.enableJsIrTransformation=true
